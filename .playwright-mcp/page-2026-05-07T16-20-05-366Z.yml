        - generic [ref=e15]:
          - paragraph [ref=e16]:
            - emphasis [ref=e17]: …in the Email Classifier Solution Project
          - heading "DistilBERT Transformer" [level=2] [ref=e18]
          - paragraph [ref=e19]: "The classification model is a DistilBERT transformer. DistilBERT is a condensed version of the Google’s BERT transformer. DistilBERT, with 66 million parameters, is a fraction of the size of large GPT models: GPT-4 and Grok4 at (estimated) 1.7 trillion parameters are 25.000 times larger than DistilBERT. And yet, DistilBERT performs well for text classification tasks and can do so while running locally on a relatively ordinary PC."
          - heading "Training Pipeline" [level=2] [ref=e20]
          - figure [ref=e21]:
            - iframe [ref=e23]:
              - region "Video Player" [ref=f6e2]:
                - text: 
                - dialog "Modal Window" [ref=f6e4]:
                  - paragraph [ref=f6e5]: This is a modal window.
                  - document [ref=f6e6]:
                    - generic [ref=f6e7]: Loading…
          - paragraph [ref=e24]: The training pipeline is written in Python with PyTorch, consisting of command line utilities to encode training data and to do actual training runs. A dictionary file defines categories and subcategories, configuring training heads accordingly. Training runs are parameter-driven. A training config file contains hyperparameters to optimize. A number of common training optimization techniques are available to use. Performance metrics and realtime parameters are logged extensively for analysis. A training run tracks a best model epoch and creates per-epoch visualizations. Best-model checkpoints are saved with rich state data to allow for fine-tuning later.
          - heading "Utility App" [level=2] [ref=e25]
          - paragraph [ref=e26]: The utility app provides means to run evaluations, to check and track model performance, to organize samples, to collect data for future training runs, and to curate routing rules.
          - figure "Utility App Core Flow" [ref=e27]:
            - generic [ref=e28]: Utility App Core Flow
          - heading "Samples, Queue, Batches" [level=3] [ref=e29]
          - paragraph [ref=e30]:
            - text: When an
            - emphasis [ref=e31]: email
            - text: comes into the app, it becomes a
            - emphasis [ref=e32]: sample
            - text: . The app uses batches to allow the user to organize samples. The
            - emphasis [ref=e33]: queue
            - text: is a special batch that contains all the samples that are ready to be processed by the model. The app performs
            - emphasis [ref=e34]: evaluation runs
            - text: ", handing the samples in the queue to the inference pipeline, where the model evaluates the samples, assigning classifications. The evaluated samples are moved to an evaluation batch, where routing rules can be applied, to determine whom to send the email to."
          - figure "Utility App Core Flow & Sample Batch Management" [ref=e35]:
            - generic [ref=e36]: Utility App Core Flow & Sample Batch Management
          - heading "Validation & Manual Review" [level=3] [ref=e37]
          - paragraph [ref=e38]:
            - text: Samples come with or without
            - emphasis [ref=e39]: validation data,
            - text: "to check if the model classifies a sample correctly. Samples in production (actual emails written by people) do not have validation data. Samples that are LLM-generated using the training-data generation process, and manually authored samples, have validation data. When a model evaluates a sample with validation data, its performance is captured: did it get it right?"
          - paragraph [ref=e40]:
            - text: Any sample
            - emphasis [ref=e41]: without
            - text: validation data that is evaluated (classified) by the model can be manually reviewed. The reviewer approves the model’s evaluation of the sample or assigns corrections. The manual review then provides validation data for future model training.
          - paragraph [ref=e42]: Model performance is accumulated and tracked across all evaluated samples with validation data and with manual review data.
          - heading "Utility App Tech Stack" [level=3] [ref=e43]
          - paragraph [ref=e44]: The user-facing utility app is python using SQLite, Vite, React and PyTorch to run inference. To allow room to grow, the app has abstraction layers to replace SQLite with a more sophisticated database and to replace locally-run inference with an API-driven solution. The front end uses Ant Design with a token-based design system.
          - heading "“Crawl” State" [level=3] [ref=e45]
          - paragraph [ref=e46]:
            - text: In the
            - emphasis [ref=e47]: crawl
            - text: of the app, there is no integration with external email systems yet, but the API is ready for an integration with a workflow automation system like N8N, which connects to email systems. In a large-scale production deployment, a dedicated data ingestion bridge to connect to an email server may be more advisable.
