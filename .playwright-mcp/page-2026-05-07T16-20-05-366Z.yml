          - heading "Process" [level=2] [ref=e68]
          - paragraph [ref=e69]: I use Cursor, Claude, Claude Code and other LLM tools to inform technology choices, toe explore architecture options, to build, and to generate training data.
          - paragraph [ref=e70]: The project complexity is well beyond “vibe coding scale”. I follow a “one-person product organization” approach, relying on documentation-driven process, step-by-step implementation and testing. I start with notebook sketches, write PRDs, design documents (some just by myself, some in dialog with an LLM), architecture documents, plans, and then prompts.
          - figure "Utility app showing sample pool in dark mode, responsive layout" [ref=e71]:
            - link [ref=e72] [cursor=pointer]:
              - /url: https://knutopia.wordpress.com/wp-content/uploads/2025/08/utility-app-sample-pool-w-inspector-responsive-dark-2.png
            - generic [ref=e73]: Utility app showing sample pool in dark mode, responsive layout
          - heading "React & Ant Design" [level=3] [ref=e74]
          - paragraph [ref=e75]: For the front end, I chose React (as opposed to something more modern) since LLMs are well-trained on it. This was helpful both for prototyping screens and for the actual implementation. Ant Design is a great design system to use because it comes with robust enterprise grade features, such as flexible tables, which can otherwise be hard to deal with. Ant Design also offers a sophisticated design token system to keep CSS clean and simple.
          - heading "UX Design Process" [level=3] [ref=e76]
          - paragraph [ref=e77]: "To design the UX, I bypassed sketching in Figma. After doing paper sketches and taking notes, I iterated on a PRD document and on a feature-by-feature UX specification supported by sample .json data files. These documents informed a series of prototypes in Cursor. A prototype then served as a reference for implementation. The implementation always gets refined too: nothing like running code to experience and optimize flow. Eventually it is good."
          - paragraph [ref=e78]: I also explored doing actual sketches with Figma’s First Draft feature and with Google Stitch, but did not like being stuck with dead-end drawings. These tools also had a harder time creating results with appropriate amount of detail and structure. Figma Make could have been another option, but I just stuck with my default tools to get the job done.
          - paragraph [ref=e79]: "For what it’s worth: this page is 100% human-written."
