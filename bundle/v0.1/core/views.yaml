          render_mode: annotate_initiative_when_target_out_of_scope
          target_type_order: [Place, ViewState, Component, Process, SystemAction]
          display:
            label: Implemented by
            include_target_id: true
            include_target_name_when_available: true
        detail_display:
          compact:
            show_instrumentation_annotations: false
            show_implementation_annotations: false
          detailed:
            show_instrumentation_annotations: true
            show_implementation_annotations: true

