              label:
                visible: true
                text: measured by
            IMPLEMENTED_BY:
              channel: implementation_reference
              label:
                visible: true
                text: implemented by
            INSTRUMENTED_AT:
              channel: instrumentation_reference
              label:
                visible: true
                text: instrumented at
          priority_order: [SUPPORTS, ADDRESSES, MEASURED_BY, IMPLEMENTED_BY, INSTRUMENTED_AT]
        instrumentation_annotations:
          source_edge_type: INSTRUMENTED_AT
          render_mode: annotate_metric_when_target_out_of_scope
